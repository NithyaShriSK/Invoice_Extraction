services:
  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_NAME: invoice_app
      SECRET_KEY: your-secret-key-change-in-production
      DEBUG: "False"
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://backend:8000
      OLLAMA_HOST: http://host.docker.internal:11434
      HOST_OCR_SERVICE: http://host.docker.internal:5001
      HOST_OCR_TIMEOUT_SECONDS: "1800"
    volumes:
      - ./backend:/app
      - ./deep.py:/app/scripts/deep.py
      - ./llm_correct.py:/app/scripts/llm_correct.py
      - ./uploads:/app/uploads
      - ./output:/app/output
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - invoice_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_API_URL: http://localhost:8000
      REACT_APP_ENV: development
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - invoice_network

networks:
  invoice_network:
    driver: bridge
